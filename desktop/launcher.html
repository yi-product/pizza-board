<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>披萨画板</title>
<style>
  :root {
    --bg: #2E4DB5;
    --bg-dark: #1A2E6B;
    --accent: #FF4D4D;
    --accent-dark: #CC2222;
    --yellow: #FFD93D;
    --text: #fff;
    --muted: rgba(255,255,255,.62);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    color: var(--text); background: var(--bg); overflow: hidden;
  }
  body {
    background:
      radial-gradient(ellipse at 18% 12%, rgba(255,255,255,.08), transparent 46%),
      radial-gradient(ellipse at 88% 88%, rgba(0,0,0,.22), transparent 50%),
      linear-gradient(135deg, #3a5fd0 0%, var(--bg) 48%, var(--bg-dark) 100%);
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 36px 48px 28px;
  }
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 28px;
  }
  .brand {
    display: flex; align-items: center; gap: 14px;
    font-size: 28px; font-weight: 800; letter-spacing: -.6px;
  }
  .logo {
    width: 48px; height: 48px; border-radius: 8px;
    background: var(--yellow);
    box-shadow: 4px 4px 0 rgba(15,28,78,.45);
  }
  .sub { color: var(--muted); font-size: 15px; font-weight: 600; padding-bottom: 4px; }
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 18px;
    min-height: 0;
  }
  .card {
    appearance: none; border: 0; color: inherit; text-align: left;
    background: rgba(10, 20, 60, .38);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    padding: 28px 26px;
    cursor: pointer;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 8px 8px 0 rgba(10,20,60,.35);
    transition: transform .12s, box-shadow .12s, background .12s;
  }
  .card:active { transform: translate(3px, 3px); box-shadow: 4px 4px 0 rgba(10,20,60,.35); }
  .card.featured {
    grid-row: 1 / span 2;
    background: rgba(10, 20, 60, .55);
    border-color: rgba(255,217,61,.35);
  }
  .tag {
    display: inline-block;
    font-size: 12px; font-weight: 800; letter-spacing: .6px;
    padding: 5px 10px; border-radius: 6px;
    background: var(--yellow); color: #1a1a1f;
    text-transform: uppercase;
  }
  .tag.red { background: var(--accent); color: #fff; }
  .tag.ghost { background: rgba(255,255,255,.12); color: #fff; }
  h2 { margin: 14px 0 8px; font-size: 32px; letter-spacing: -.8px; }
  .featured h2 { font-size: 44px; }
  p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.55; max-width: 36em; }
  .go {
    margin-top: 22px; font-size: 15px; font-weight: 800; color: var(--yellow);
  }
  footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 18px; color: var(--muted); font-size: 13px; font-weight: 600;
  }
  .quit {
    appearance: none; border: 0; background: rgba(255,255,255,.1);
    color: #fff; font-weight: 800; font-size: 14px;
    padding: 12px 18px; border-radius: 10px; cursor: pointer;
  }
  @media (max-width: 1100px) {
    .grid { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
    .card.featured { grid-row: auto; grid-column: 1 / -1; min-height: 220px; }
    .featured h2, h2 { font-size: 26px; }
    .wrap { padding: 20px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <svg class="logo" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="8" fill="#FFD93D"/>
          <circle cx="20" cy="20" r="10" fill="#FF6B6B" opacity=".28"/>
          <circle cx="16" cy="18" r="2" fill="#4ECDC4"/>
          <circle cx="24" cy="22" r="1.6" fill="#2D2926"/>
          <circle cx="22" cy="16" r="1.2" fill="#FF8C42"/>
        </svg>
        披萨画板
      </div>
      <div class="sub">点一张方案全屏试玩 · 左下角连点 5 次可返回 / 退出</div>
    </header>

    <div class="grid">
      <button class="card featured" data-id="receipt">
        <div>
          <span class="tag">推荐先试</span>
          <h2>网格 + 小票 + 绘制</h2>
          <p>最完整的一版：披萨墙、右侧热度小票、点「Draw」进入画饼。适合在 55 寸屏上看整体流程。</p>
        </div>
        <div class="go">进入方案 →</div>
      </button>

      <button class="card" data-id="receipt#draw">
        <div>
          <span class="tag red">直接开画</span>
          <h2>绘制模式</h2>
          <p>跳过墙面，直接摸红外画笔手感。</p>
        </div>
        <div class="go">开始画 →</div>
      </button>

      <button class="card" data-id="baseline">
        <div>
          <span class="tag ghost">方案一</span>
          <h2>基线画布</h2>
          <p>左侧排行榜 + 格子画布，可领位、点赞、命名保存。</p>
        </div>
        <div class="go">进入方案 →</div>
      </button>

      <button class="card" data-id="gallery">
        <div>
          <span class="tag ghost">方案二</span>
          <h2>散落披萨墙</h2>
          <p>全屏展示墙，看远距离吸引效果。</p>
        </div>
        <div class="go">进入方案 →</div>
      </button>

      <button class="card" data-id="grid">
        <div>
          <span class="tag ghost">网格</span>
          <h2>规整网格</h2>
          <p>只有墙、没有小票栏，对比布局密度。</p>
        </div>
        <div class="go">进入方案 →</div>
      </button>
    </div>

    <footer>
      <span>快捷键：Ctrl+Shift+Q 退出 · Ctrl+Shift+L 回方案选择 · Ctrl+Shift+W 退出全屏</span>
      <button class="quit" id="quitBtn" type="button">退出应用</button>
    </footer>
  </div>
  <script>
    document.querySelectorAll(".card").forEach((btn) => {
      btn.addEventListener("click", () => window.pizzaApp.openProto(btn.dataset.id));
    });
    document.getElementById("quitBtn").onclick = () => window.pizzaApp.quit();
  </script>
</body>
</html>
