<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pizza Board · Print</title>
<style>
  @page { size: A4 portrait; margin: 0; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 210mm;
    height: 297mm;
  }

  body {
    font-family: "Segoe UI", Inter, system-ui, sans-serif;
    color: #1A1A1F;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 没有这两行，浏览器打印时会把背景色和边框洗掉 */
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* 白底 + 彩色描边，而不是整页铺色：A4 满版彩底非常费墨 */
  .card {
    width: 172mm;
    height: 252mm;
    border: 2.4mm solid #FF3B30;
    border-radius: 8mm;
    padding: 13mm 12mm 9mm;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .kicker {
    font-size: 3.6mm;
    letter-spacing: .36em;
    text-transform: uppercase;
    font-weight: 700;
    color: #C8843F;
  }

  h1 {
    margin-top: 3mm;
    font-size: 10.5mm;
    line-height: 1.12;
    font-weight: 800;
    text-align: center;
    letter-spacing: -0.01em;
  }

  .art {
    margin-top: 5mm;
    width: 134mm;
    height: 134mm;
  }
  .art img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .sig-label {
    margin-top: 5mm;
    font-size: 3.2mm;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #9a9aa4;
  }

  .sig {
    margin-top: 1.5mm;
    height: 27mm;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sig img { max-height: 100%; max-width: 112mm; object-fit: contain; }

  .rule {
    width: 100%;
    height: .4mm;
    background: #EAEAEF;
    margin-top: auto;
  }

  .foot {
    width: 100%;
    margin-top: 4.5mm;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 3.5mm;
    color: #6B6B75;
  }
  .brand {
    font-weight: 800;
    font-size: 4.2mm;
    color: #1A1A1F;
    letter-spacing: .02em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">Pizza Board</div>
    <h1 id="title">If I were a pizza chef</h1>

    <div class="art"><img id="art" alt=""></div>

    <div class="sig-label">Chef</div>
    <div class="sig"><img id="sig" alt=""></div>

    <div class="rule"></div>
    <div class="foot">
      <span class="brand" id="brand"></span>
      <span id="meta"></span>
    </div>
  </div>

<script>
/** 主进程通过 executeJavaScript 调这个函数；返回的 Promise 落定后才会真正下发打印 */
function renderTicket(data) {
  data = data || {};
  document.getElementById("title").textContent = data.title || "If I were a pizza chef";
  document.getElementById("brand").textContent = data.brand || "";

  const meta = [];
  if (data.id != null) meta.push("No." + data.id);
  if (data.created) {
    meta.push(new Date(data.created).toLocaleDateString("en-US", {
      year: "numeric", month: "short", day: "numeric"
    }));
  }
  document.getElementById("meta").textContent = meta.join("   ·   ");

  const jobs = [];
  const set = (id, src) => {
    const el = document.getElementById(id);
    if (!src) { el.style.display = "none"; return; }
    jobs.push(new Promise(res => { el.onload = res; el.onerror = res; }));
    el.src = src;
  };
  set("art", data.art);
  set("sig", data.sig);

  return Promise.all(jobs)
    .then(() => (document.fonts ? document.fonts.ready : null))
    .then(() => true);
}
</script>
</body>
</html>
