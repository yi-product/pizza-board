<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>披萨画板 · Steam Heat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  /* ==== Design System v5 · Blue Grid + Ordered Pizza Characters ====
     核心：等展示机会 / 规整网格 / 更无机几何 / 色彩平衡
  */
  :root {
    --bg:           #2E4DB5;
    --bg-dark:      #1A2E6B;
    --grid-line:    rgba(255,255,255,0.10);
    --grid-dot:     rgba(255,255,255,0.18);
    --text:         #FFFFFF;
    --text-muted:   rgba(255,255,255,0.58);
    --accent:       #FF4D4D;
    --accent-dark:  #CC2222;
    --cell:         rgba(255,255,255,0.03);
    --font-display: "Inter", "Noto Sans SC", system-ui, sans-serif;
    --font-body:    "Inter", "Noto Sans SC", system-ui, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    font-family: var(--font-body);
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }

  /* 几何网格背景 */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle, var(--grid-dot) 2px, transparent 2px);
    background-size: 80px 80px;
    background-position: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ==== Header ==== */
  .header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px;
    background: var(--bg);
    border-bottom: 1px solid var(--grid-line);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-display);
    font-size: 18px; font-weight: 800;
    color: var(--text); letter-spacing: -0.4px;
  }
  .brand-icon { width: 30px; height: 30px; }
  .header-right {
    display: flex; align-items: center; gap: 18px;
  }
  .stats {
    display: flex; align-items: baseline; gap: 22px;
    font-family: var(--font-display);
    font-size: 13px; font-weight: 600;
    color: var(--text-muted);
  }
  .stats b { color: var(--text); font-weight: 800; margin-right: 3px; }
  .btn-draw {
    font-family: var(--font-display);
    font-size: 13px; font-weight: 700;
    padding: 10px 20px;
    border: none; border-radius: 2px;
    background: var(--accent); color: #fff;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--accent-dark);
    transition: transform .1s, box-shadow .1s;
    letter-spacing: 0.2px;
  }
  .btn-draw:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--accent-dark); }
  .btn-draw:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--accent-dark); }

  /* ==== 墙面：网格，右侧给小票墙留空 ==== */
  .wall {
    position: fixed;
    top: 65px; left: 0;
    right: 210px;
    bottom: 0;
    overflow: hidden;
    z-index: 1;
  }

  /* ==== 右侧热力排名墙 ==== */
  .heat-wall {
    position: fixed;
    top: 65px; right: 0; bottom: 0;
    width: 210px;
    z-index: 50;
    display: flex; flex-direction: column;
    background: var(--bg);
    border-left: 1px solid var(--grid-line);
    transition: transform .55s cubic-bezier(.55, 0, 1, 1);
  }
  .heat-wall.falling {
    transform: translateX(120%);
  }
  /* 热力表头 */
  .heat-header {
    position: relative;
    height: 72px;
    margin: 0 12px;
    flex-shrink: 0;
    z-index: 3;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #FF6B6B 0%, #FF4D4D 100%);
    border-radius: 0 0 10px 10px;
    box-shadow: 0 4px 0 #B91C1C, 4px 6px 0 rgba(15,28,78,0.35);
    color: #fff;
    overflow: hidden;
    transition: transform .1s;
  }
  .heat-header:hover { transform: translateY(-2px); }
  .heat-header:active { transform: translateY(1px); }
  .heat-header::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.05) 0 4px,
      transparent 4px 8px
    );
  }
  .heat-icon {
    font-size: 22px;
    line-height: 1;
    margin-bottom: 2px;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,0.2));
  }
  .heat-label {
    position: relative;
    font-family: var(--font-display);
    font-size: 10px; font-weight: 800;
    letter-spacing: 0.6px;
    text-shadow: 0 1px 0 rgba(0,0,0,0.15);
  }
  .heat-meter {
    position: absolute; left: 10px; right: 10px; bottom: 10px; height: 6px;
    background: rgba(0,0,0,0.15);
    border-radius: 3px; overflow: hidden;
  }
  .heat-meter-fill {
    width: 100%; height: 100%;
    background: linear-gradient(90deg, #FFD93D, #FF8C42, #FF4D4D);
    animation: heat-pulse 2s ease-in-out infinite;
  }
  @keyframes heat-pulse {
    0%,100% { opacity: .85; }
    50% { opacity: 1; }
  }

  /* 热榜纸 */
  .heat-paper {
    position: relative;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    margin: 0 18px;
    padding-top: 8px;
    background: linear-gradient(180deg, #FFF5F0 0%, #FFF 120px);
    color: #2D3748;
    box-shadow: 4px 4px 0 rgba(15,28,78,0.2);
  }
  .heat-paper::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 0;
    height: 10px;
    background: repeating-linear-gradient(
      90deg,
      transparent 0 6px,
      #FED7D7 6px 8px,
      transparent 8px 14px
    );
  }
  .heat-list {
    padding: 14px 10px 80px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .heat-item {
    background: #fff;
    border-bottom: 1.5px dashed #FEB2B2;
    padding: 7px 6px 7px 8px;
    cursor: pointer;
    position: relative;
    transform-origin: top center;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
    transition: transform .12s, background .12s;
    display: flex; align-items: center; gap: 8px;
  }
  .heat-item:hover {
    background: #FFF5F0;
    transform: scale(1.02);
  }
  .heat-item::before {
    content: "";
    position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px;
    background: var(--accent);
  }
  .heat-item.top-1::before { background: #FFD93D; }
  .heat-item.top-2::before { background: #C0C0C0; }
  .heat-item.top-3::before { background: #CD7F32; }
  .heat-thumb {
    width: 40px; height: 40px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: #FFD93D;
    box-shadow: 2px 2px 0 rgba(15,28,78,0.2);
  }
  .heat-thumb canvas { width: 100%; height: 100%; }
  .heat-body { flex: 1; min-width: 0; }
  .heat-rank {
    font-size: 9px; font-weight: 700;
    margin-bottom: 1px;
    color: #9B2C2C;
  }
  .heat-name {
    font-size: 10px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 1px;
  }
  .heat-meta {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 8px;
    color: #718096;
  }
  .heat-likes { font-weight: 700; color: #E53E3E; }

  .heat-bar-wrap {
    position: relative;
    height: 5px;
    background: #FED7D7;
    border-radius: 3px;
    margin-top: 3px;
  }
  .heat-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #FFD93D, #FF8C42, #FF4D4D);
    border-radius: 3px;
    transition: width .8s cubic-bezier(.22,1,.36,1);
  }

  /* 蒸汽动画 */
  .steam-wrap {
    position: absolute;
    right: 4px; top: -10px;
    width: 28px; height: 20px;
    pointer-events: none;
    overflow: visible;
  }
  .puff {
    position: absolute;
    bottom: 0; left: 50%;
    width: 8px; height: 8px;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    filter: blur(2px);
    animation: steam-rise 2.2s ease-out infinite;
    opacity: 0;
  }
  @keyframes steam-rise {
    0% { transform: translate(-50%, 0) scale(.6); opacity: 0; }
    20% { opacity: .8; }
    100% { transform: translate(-50%, -22px) scale(1.4); opacity: 0; }
  }

  .heat-printing .heat-item {
    animation: heat-roll .5s cubic-bezier(.25, 1.55, .45, 1) backwards;
  }
  @keyframes heat-roll {
    from { opacity: 0; transform: translateY(-30px) scaleY(0.6); }
    to   { opacity: 1; transform: translateY(0) scaleY(1); }
  }


  /* ==== 单个披萨项 ==== */
  .pizza-item {
    position: absolute;
    cursor: pointer;
    transition: transform .22s cubic-bezier(.34,1.56,.64,1), z-index 0s;
    will-change: transform;
    filter: drop-shadow(6px 6px 0 rgba(15, 28, 78, 0.5));
  }
  .pizza-item:hover {
    z-index: 80 !important;
    transform: scale(1.08) rotate(var(--rot)) !important;
    filter: drop-shadow(10px 10px 0 rgba(15, 28, 78, 0.65));
  }
  .pizza-item:active { transition-duration: .1s; transform: scale(1.02) rotate(var(--rot)) !important; }

  /* 绘制过渡：披萨掉落出屏幕 */
  .pizza-item.falling {
    transition: transform .55s cubic-bezier(.55, 0, 1, 1), filter .55s;
    transform: translateY(130vh) rotate(calc(var(--rot) + 45deg)) scale(0.75) !important;
    filter: drop-shadow(2px 2px 0 rgba(15, 28, 78, 0.25)) !important;
    pointer-events: none;
  }

  @keyframes grid-in {
    from { opacity: 0; transform: translateY(-130vh) rotate(calc(var(--rot) - 28deg)) scale(0.72); }
    to   { opacity: 1; transform: scale(1) rotate(var(--rot)); }
  }
  .pizza-item { animation: grid-in .65s cubic-bezier(.25, 1.45, .45, 1) backwards; }

  .cell-frame {
    position: absolute;
    inset: 8px;
    border: 1px solid var(--grid-line);
    border-radius: 2px;
    background: var(--cell);
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }
  .pizza-item:hover .cell-frame { opacity: 1; }

  .plate {
    width: var(--size, 140px);
    height: var(--size, 140px);
    border-radius: 50%;
    background: #FFD93D;
    position: relative;
    overflow: hidden;
  }
  .plate canvas { width: 100%; height: 100%; border-radius: 50%; }

  .plate.empty {
    background: transparent;
    border: 2px dashed var(--grid-dot);
    display: flex; align-items: center; justify-content: center;
  }
  .plate.empty::after {
    content: "+";
    font-family: var(--font-display);
    font-size: 34px; font-weight: 800;
    color: var(--grid-dot);
  }

  .name-tag {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%) rotate(calc(-1 * var(--rot))) scale(0.9);
    background: var(--bg-dark);
    padding: 4px 10px;
    border-radius: 2px;
    font-family: var(--font-display);
    font-size: 10px; font-weight: 700;
    color: #fff;
    white-space: nowrap;
    max-width: 130px;
    overflow: hidden; text-overflow: ellipsis;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .pizza-item:hover .name-tag { opacity: 1; transform: translateX(-50%) rotate(calc(-1 * var(--rot))) scale(1); }

  .like-btn {
    position: absolute;
    top: 0; right: 0;
    display: flex; align-items: center; gap: 2px;
    background: #fff;
    border-radius: 2px;
    padding: 3px 6px;
    font-family: var(--font-display);
    font-size: 9px; font-weight: 800;
    color: var(--bg-dark);
    cursor: pointer;
    z-index: 3;
    transition: all .12s;
    box-shadow: 2px 2px 0 rgba(15,28,78,0.4);
  }
  .like-btn:hover { transform: scale(1.1); background: var(--accent); color: #fff; }
  .like-btn:active { transform: scale(.95); }
  .like-btn.liked { background: var(--accent); color: #fff; }
  .like-btn svg { width: 9px; height: 9px; flex-shrink: 0; }

  .pizza-item.is-new { filter: drop-shadow(4px 4px 0 rgba(15,28,78,0.35)); }
  .pizza-item.is-new .plate.empty { border-color: var(--grid-dot); }

  /* ==== 绘制 Overlay ==== */
  .draw-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 200;
    display: none; flex-direction: column;
    opacity: 0;
    transition: opacity .35s;
    pointer-events: none;
  }
  .draw-overlay.show {
    display: flex;
    opacity: 1;
    pointer-events: auto;
  }
  .draw-overlay.hiding {
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s;
  }

  .draw-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px;
    background: var(--bg);
    border-bottom: 1px solid var(--grid-line);
  }
  @keyframes header-slide-in {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes header-slide-out {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-30px); }
  }
  .draw-overlay.show .draw-header {
    animation: header-slide-in .5s cubic-bezier(.25, 1.5, .45, 1) backwards;
  }
  .draw-overlay.hiding .draw-header {
    animation: header-slide-out .4s cubic-bezier(.55, 0, 1, 1) forwards;
  }
  .draw-back {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-display);
    font-size: 14px; font-weight: 600;
    color: var(--text-muted);
    background: none; border: none;
    cursor: pointer; padding: 8px 14px;
    border-radius: 2px; transition: background .12s, color .12s;
  }
  .draw-back:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .draw-title {
    font-family: var(--font-display);
    font-size: 16px; font-weight: 800;
  }
  .draw-save-btn {
    font-family: var(--font-display);
    font-size: 13px; font-weight: 700;
    padding: 10px 22px;
    border: none; border-radius: 2px;
    background: var(--accent); color: #fff;
    cursor: pointer; transition: transform .12s;
    box-shadow: 4px 4px 0 var(--accent-dark);
  }
  .draw-save-btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--accent-dark); }
  .draw-save-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--accent-dark); }

  .draw-stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; overflow: hidden;
    position: relative;
  }

  .draw-tray {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 28px 52px 28px 32px;
    background: linear-gradient(180deg, #E2E8F0 0%, #CBD5E0 100%);
    border-radius: 18px;
    box-shadow: 0 14px 0 #718096, 8px 22px 0 rgba(15,28,78,0.42);
    transform: rotate(-3deg);
  }
  .draw-tray::before {
    content: "";
    position: absolute; inset: 14px 48px 14px 14px;
    background-image: radial-gradient(circle, #94A3B8 2px, transparent 2.5px);
    background-size: 13px 13px;
    border-radius: 10px;
    opacity: 0.45;
  }
  .tray-handle {
    position: absolute;
    top: -100vh;
    right: 24px;
    width: 44px;
    height: calc(100vh + 80px);
    background: linear-gradient(90deg, #CBD5E0 0%, #A0AEC0 100%);
    border-radius: 10px 10px 0 0;
    box-shadow: 4px 0 0 #718096, 8px 0 0 rgba(15,28,78,0.28);
    transform: rotate(10deg);
    transform-origin: bottom center;
    pointer-events: none;
  }
  .tray-handle::before {
    content: "";
    position: absolute; inset: 10vh 9px 34px 9px;
    background-image: radial-gradient(circle, #94A3B8 2px, transparent 2.5px);
    background-size: 12px 12px;
    opacity: 0.42;
  }
  .tray-handle::after {
    content: "";
    position: absolute;
    top: 6vh; left: 50%;
    transform: translateX(-50%);
    width: 16px; height: 34px;
    border: 3px solid #4A5568;
    border-radius: 8px;
  }
  @keyframes tray-send-in {
    from { opacity: 0; transform: translateY(-160vh) rotate(-8deg) scale(0.88); }
    to   { opacity: 1; transform: translateY(0) rotate(-3deg) scale(1); }
  }
  @keyframes tray-send-out {
    from { opacity: 1; transform: translateY(0) rotate(-3deg) scale(1); }
    to   { opacity: 0; transform: translateY(-160vh) rotate(-8deg) scale(0.88); }
  }
  .draw-overlay.show .draw-tray {
    animation: tray-send-in .9s cubic-bezier(.25, 1.45, .45, 1) .05s backwards;
  }
  .draw-overlay.hiding .draw-tray {
    animation: tray-send-out .65s cubic-bezier(.55, 0, 1, 1) forwards;
  }

  .draw-plate {
    width: 380px; height: 380px;
    border-radius: 50%;
    background: #FFD93D;
    box-shadow: 12px 12px 0 rgba(15,28,78,0.5);
    position: relative; overflow: hidden;
    z-index: 2;
  }
  @keyframes plate-send-in {
    from { opacity: 0; transform: translateY(-140vh) rotate(-18deg) scale(0.72); }
    to   { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
  }
  @keyframes plate-send-out {
    from { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
    to   { opacity: 0; transform: translateY(-140vh) rotate(-18deg) scale(0.72); }
  }
  .draw-overlay.show .draw-plate {
    animation: plate-send-in .85s cubic-bezier(.25, 1.45, .45, 1) .12s backwards;
  }
  .draw-overlay.hiding .draw-plate {
    animation: plate-send-out .6s cubic-bezier(.55, 0, 1, 1) forwards;
  }
  .draw-plate canvas { width: 100%; height: 100%; border-radius: 50%; touch-action: none; }

  .draw-toolbar {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-dark);
    border-radius: 2px;
    padding: 10px 16px;
    box-shadow: 6px 6px 0 rgba(10,20,60,0.6);
  }
  @keyframes toolbar-pop-in {
    from { opacity: 0; transform: translateX(-50%) translateY(90px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes toolbar-pop-out {
    from { opacity: 1; transform: translateX(-50%) translateY(0); }
    to   { opacity: 0; transform: translateX(-50%) translateY(90px); }
  }
  .draw-overlay.show .draw-toolbar {
    animation: toolbar-pop-in .6s cubic-bezier(.25, 1.55, .45, 1) .1s backwards;
  }
  .draw-overlay.hiding .draw-toolbar {
    animation: toolbar-pop-out .45s cubic-bezier(.55, 0, 1, 1) forwards;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(18px) scale(0.8); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .color-swatch {
    width: 26px; height: 26px; border-radius: 2px;
    border: 2px solid transparent; cursor: pointer;
    transition: transform .12s, border-color .12s;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.25);
  }
  .draw-overlay.show .color-swatch {
    animation: pop-in .35s cubic-bezier(.25, 1.55, .45, 1) backwards;
  }
  .draw-overlay.show .color-swatch:nth-child(1) { animation-delay: .25s; }
  .draw-overlay.show .color-swatch:nth-child(2) { animation-delay: .27s; }
  .draw-overlay.show .color-swatch:nth-child(3) { animation-delay: .29s; }
  .draw-overlay.show .color-swatch:nth-child(4) { animation-delay: .31s; }
  .draw-overlay.show .color-swatch:nth-child(5) { animation-delay: .33s; }
  .draw-overlay.show .color-swatch:nth-child(6) { animation-delay: .35s; }
  .draw-overlay.show .color-swatch:nth-child(7) { animation-delay: .37s; }
  .draw-overlay.show .color-swatch:nth-child(8) { animation-delay: .39s; }
  .draw-overlay.show .color-swatch:nth-child(9) { animation-delay: .41s; }
  .color-swatch:hover { transform: scale(1.12); }
  .color-swatch.active { border-color: #fff; transform: scale(1.15); }
  .toolbar-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.15); }
  .tool-btn {
    font-family: var(--font-display); font-size: 12px; font-weight: 700;
    padding: 7px 13px; border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 2px; background: transparent; color: #fff;
    cursor: pointer; transition: all .1s;
  }
  .draw-overlay.show .tool-btn {
    animation: pop-in .35s cubic-bezier(.25, 1.55, .45, 1) backwards;
  }
  .draw-overlay.show .tool-btn:nth-of-type(1) { animation-delay: .42s; }
  .draw-overlay.show .tool-btn:nth-of-type(2) { animation-delay: .46s; }
  .draw-overlay.show .brush-size {
    animation: pop-in .35s cubic-bezier(.25, 1.55, .45, 1) .5s backwards;
  }
  .tool-btn:hover { border-color: #fff; }
  .tool-btn.active { background: #fff; color: var(--bg-dark); border-color: #fff; }
  .brush-size {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-display); font-size: 11px; font-weight: 600;

  }
  .brush-size input { width: 70px; accent-color: var(--accent); }

  .float-heart {
    position: fixed; pointer-events: none; z-index: 300;
    font-size: 22px;
    animation: heart-float 1.2s ease-out forwards;
  }
  @keyframes heart-float {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-110px) scale(1.6) rotate(18deg); }
  }

  .toast {
    position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%);
    background: #fff; color: var(--bg-dark);
    font-family: var(--font-display);
    font-size: 13px; font-weight: 700;
    padding: 10px 20px; border-radius: 2px;
    z-index: 400; opacity: 0; transition: opacity .3s;
    pointer-events: none;
    box-shadow: 4px 4px 0 rgba(15,28,78,0.35);
  }
  .toast.show { opacity: 1; }

  /* ==== 排行榜 Overlay ==== */
  .leaderboard-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 210;
    display: none; flex-direction: column;
    opacity: 0; transition: opacity .3s;
  }
  .leaderboard-overlay.show { display: flex; opacity: 1; }
  .leaderboard-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px;
    background: var(--bg);
    border-bottom: 1px solid var(--grid-line);
  }
  .leaderboard-title {
    font-family: var(--font-display);
    font-size: 16px; font-weight: 800;
  }
  .leaderboard-list {
    flex: 1; overflow-y: auto;
    padding: 20px 28px 40px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .lb-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--grid-line);
    border-radius: 4px;
    padding: 14px;
    display: flex; align-items: center; gap: 14px;
    transition: transform .15s, background .15s;
    position: relative;
    overflow: hidden;
  }
  .lb-card:hover { background: rgba(255,255,255,0.09); transform: translateY(-2px); }
  .lb-rank {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #fff; color: var(--bg-dark);
    font-family: var(--font-display); font-size: 14px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .lb-rank.gold { background: #FFD93D; }
  .lb-rank.silver { background: #C0C0C0; }
  .lb-rank.bronze { background: #CD7F32; color: #fff; }
  .lb-thumb {
    width: 54px; height: 54px; border-radius: 50%; overflow: hidden;
    flex-shrink: 0; background: #FFD93D;
  }
  .lb-thumb canvas { width: 100%; height: 100%; }
  .lb-info { flex: 1; min-width: 0; }
  .lb-name {
    font-family: var(--font-display); font-size: 13px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .lb-author {
    font-size: 11px; color: var(--text-muted); margin-top: 2px;
  }
  .lb-likes {
    font-family: var(--font-display); font-size: 14px; font-weight: 800;
    color: var(--accent);
  }
  .lb-heat-bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: rgba(255,255,255,0.08);
  }
  .lb-heat-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: linear-gradient(90deg, #FFD93D, #FF8C42, #FF4D4D);
    transition: width .8s cubic-bezier(.22,1,.36,1);
  }
  .lb-card:hover .lb-heat-fill { filter: brightness(1.1); }

  @media (max-width: 768px) {
    .header { padding: 12px 16px; }
    .brand { font-size: 16px; } .brand-icon { width: 26px; height: 26px; }
    .stats { display: none; }
    .btn-draw { font-size: 12px; padding: 8px 14px; }
    .wall { top: 57px; right: 140px; }
    .heat-wall { width: 140px; top: 57px; }
    .heat-header { height: 54px; margin: 0 6px; }
    .heat-icon { font-size: 16px; }
    .heat-label { font-size: 7px; }
    .heat-meter { left: 7px; right: 7px; bottom: 7px; height: 4px; }
    .heat-paper { margin: 0 8px; }
    .heat-rank { font-size: 7px; }
    .heat-name { font-size: 7px; }
    .heat-meta { font-size: 6px; }
    .heat-item { padding: 4px 3px; gap: 4px; }
    .heat-thumb { width: 30px; height: 30px; }
    .heat-bar-wrap { height: 4px; margin-top: 2px; }
    .draw-plate { width: 290px; height: 290px; }
    .draw-tray { padding: 20px 40px 20px 22px; border-radius: 14px; }
    .draw-tray::before { inset: 10px 36px 10px 10px; }
    .tray-handle { top: -100vh; right: 16px; width: 34px; height: calc(100vh + 60px); }
    .tray-handle::before { inset: 10vh 7px 24px 7px; }
    .tray-handle::after { width: 11px; height: 22px; border-width: 2px; top: 5vh; }
    .draw-toolbar { padding: 8px 12px; gap: 6px; flex-wrap: wrap; max-width: 92%; }
    .leaderboard-list { grid-template-columns: 1fr; padding: 14px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="32" height="32" rx="2" fill="#FFD93D"/>
      <circle cx="20" cy="20" r="10" fill="#FF6B6B" opacity=".25"/>
      <circle cx="16" cy="18" r="2" fill="#4ECDC4"/>
      <circle cx="24" cy="22" r="1.5" fill="#95E1D3"/>
      <circle cx="22" cy="16" r="1" fill="#2D2926"/>
      <circle cx="18" cy="24" r="1.5" fill="#FF8C42"/>
    </svg>
    <span>Pizza Grid</span>
  </div>
  <div class="header-right">
    <div class="stats"><div><b id="total-count">40</b>pizzas</div><div><b id="total-likes">3.2k</b>likes</div></div>
    <button class="btn-draw" onclick="openDrawMode()">+ Draw</button>
  </div>
</header>

<div class="wall" id="wall"></div>

<!-- 右侧热力排名墙 -->
<div class="heat-wall" id="heatWall">
  <div class="heat-header" onclick="openLeaderboard()">
    <div class="heat-icon">♨</div>
    <div class="heat-label">HEAT LEVEL</div>
    <div class="heat-meter"><div class="heat-meter-fill"></div></div>
  </div>
  <div class="heat-paper" id="heatPaper">
    <div class="heat-list" id="heatList"></div>
  </div>
</div>

<!-- 排行榜 Overlay -->
<div class="leaderboard-overlay" id="leaderboardOverlay">
  <div class="leaderboard-header">
    <button class="draw-back" onclick="closeLeaderboard()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back
    </button>
    <div class="leaderboard-title">HEAT RANKING</div>
    <div style="width:60px"></div>
  </div>
  <div class="leaderboard-list" id="leaderboardList"></div>
</div>

<div class="draw-overlay" id="drawOverlay">
  <div class="draw-header">
    <button class="draw-back" onclick="closeDrawMode()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back
    </button>
    <div class="draw-title" id="drawTitle">Draw Your Pizza</div>
    <button class="draw-save-btn" onclick="saveDrawing()">Save</button>
  </div>
  <div class="draw-stage">
    <div class="draw-tray">
      <div class="draw-plate"><canvas id="drawCanvas" width="760" height="760"></canvas></div>
      <div class="tray-handle"></div>
    </div>
  </div>
  <div class="draw-toolbar">
    <div id="colorSwatches"></div>
    <div class="toolbar-divider"></div>
    <div class="brush-size">brush <input type="range" id="brushSize" min="3" max="40" value="10"></div>
    <div class="toolbar-divider"></div>
    <button class="tool-btn" id="eraserBtn" onclick="toggleEraser()">Eraser</button>
    <button class="tool-btn" onclick="clearCanvas()">Clear</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ========== 数据 ========== */
const COLORS = ["#FF4D4D","#FFD93D","#4ECDC4","#95E1D3","#FF8C42","#9B59B6","#3498DB","#2D2926","#FFFFFF"];
const NAMES = [
  "双倍芝士炸弹","夏威夷阳光","超级至尊王","蔬菜总动员","培根卷边堡","榴莲飘香号",
  "黑椒牛魔王","四季缤纷","玛格丽特之恋","海鲜大咖秀","爆浆芝心","经典意式",
  "彩虹星球","喵星人特供","午夜纽约","田园牧歌","火焰山","极简白","水果狂欢节",
  "黑松露盛宴","辣妹子","芝士瀑布","地中海之风","忍者神龟","小熊维尼","银河系",
  "早餐披萨","抹茶慕斯","BBQ烟熏","墨西哥狂想","樱花物语","霓虹甜心","火山爆发",
  "薄荷清凉","焦糖布丁","番茄狂想","蓝纹奶酪","外星人",
];
const AUTHORS = ["小明","Alice","PizzaLover","CheeseKing","TomatoFan","美食家","豆豆","阿橘","PizzaMaster","芝士控","面团诗人","烤箱巫师","PepperoniPete","MozzarellaMike","BasilBeth","DoughDave","NinjaTurtle","CatLady"];

let pizzas = [], uid = 1;

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function generatePizzaData(seed) {
  const rng = mulberry32(seed);
  return {
    id: uid++, name: NAMES[seed % NAMES.length],
    author: AUTHORS[seed % AUTHORS.length],
    likes: Math.floor(rng() * 600 + 20),
    time: Math.floor(rng() * 48) + 1 + "h ago",
    seed: seed, liked: false,
  };
}

for (let i = 0; i < 40; i++) pizzas.push(generatePizzaData(i + 42));

// 色彩平衡重排：让相邻披萨的 base 色尽量不同
function colorBalancePizzas() {
  const colorCount = 8;
  const getColorIdx = (p) => p.seed % colorCount;
  // 简单贪心：按列优先扫描，每次选与上/左不同的颜色
  const cols = Math.ceil(Math.sqrt(pizzas.length * (window.innerWidth / (window.innerHeight - 64))));
  const ordered = [];
  const pool = [...pizzas];
  for (let i = 0; i < pizzas.length; i++) {
    const row = Math.floor(i / cols);
    const col = i % cols;
    const up = row > 0 ? getColorIdx(ordered[i - cols]) : -1;
    const left = col > 0 ? getColorIdx(ordered[i - 1]) : -1;
    // 找与 up/left 都不同的披萨；没有则随便取
    let pickIdx = pool.findIndex(p => getColorIdx(p) !== up && getColorIdx(p) !== left);
    if (pickIdx === -1) pickIdx = 0;
    ordered.push(pool.splice(pickIdx, 1)[0]);
  }
  pizzas = ordered;
}
colorBalancePizzas();

/* ========== 规整网格布局 ========== */
const wall = document.getElementById("wall");
const NEW_SLOTS = 4;

function gridLayout() {
  wall.innerHTML = "";
  const heatW = window.innerWidth <= 768 ? 140 : 210;
  const W = window.innerWidth - heatW; // 减去右侧热力墙
  const H = window.innerHeight - 65;
  const total = pizzas.length + NEW_SLOTS;

  // 目标单元格大小，保证等展示机会
  const targetCell = 172;
  const cols = Math.max(3, Math.min(10, Math.floor(W / targetCell)));
  const rows = Math.ceil(total / cols);
  const cellW = W / cols;
  const cellH = H / rows;
  const size = Math.min(cellW, cellH) * 0.72;

  const items = pizzas.map((p, idx) => ({ p, isNew: false, idx }));
  for (let i = 0; i < NEW_SLOTS; i++) items.push({ p: null, isNew: true, idx: pizzas.length + i });

  items.forEach((item, idx) => {
    const col = idx % cols;
    const row = Math.floor(idx / cols);
    const x = cellW * (col + 0.5);
    const y = cellH * (row + 0.5);
    // 统一小角度旋转，交替方向，保持秩序中带一点活泼
    const rot = (idx % 2 === 0 ? 1 : -1) * (3 + (idx % 3) * 1.5);
    createPizzaItem(item, x, y, rot, size, idx);
  });
}

/* ========== 热力排名区 ========== */
const HEAT_TOP_N = 10;
function renderHeatWall() {
  const sorted = [...pizzas].sort((a, b) => b.likes - a.likes);
  const top = sorted.slice(0, HEAT_TOP_N);
  const maxLikes = top.length ? top[0].likes : 1;
  const list = document.getElementById('heatList');
  list.innerHTML = '';

  top.forEach((p, i) => {
    const rank = i + 1;
    const ratio = maxLikes > 0 ? p.likes / maxLikes : 0;
    const item = document.createElement('div');
    item.className = 'heat-item top-' + rank;

    const thumb = document.createElement('div');
    thumb.className = 'heat-thumb';
    const cv = document.createElement('canvas');
    cv.width = 80; cv.height = 80;
    drawPizzaOnCanvas(cv, p.seed);
    thumb.appendChild(cv);

    const rankLabel = rank <= 3 ? ['🔥','🥈','🥉'][rank-1] : '#' + String(rank).padStart(2, '0');
    const body = document.createElement('div');
    body.className = 'heat-body';
    body.innerHTML = `
      <div class="heat-rank">${rankLabel}</div>
      <div class="heat-name">${p.name}</div>
      <div class="heat-meta">
        <span>by ${p.author}</span>
        <span class="heat-likes">${p.likes} ♨</span>
      </div>
      <div class="heat-bar-wrap">
        <div class="heat-bar" data-width="${Math.max(4, Math.round(ratio * 100))}"></div>
        <div class="steam-wrap"></div>
      </div>
    `;

    const bar = body.querySelector('.heat-bar');
    const steamWrap = body.querySelector('.steam-wrap');
    const puffCount = Math.max(1, Math.round(ratio * 4));
    for (let s = 0; s < puffCount; s++) {
      const puff = document.createElement('div');
      puff.className = 'puff';
      puff.style.left = (30 + Math.random() * 40) + '%';
      puff.style.animationDelay = (Math.random() * 2) + 's';
      puff.style.animationDuration = (1.8 + Math.random() * 0.8) + 's';
      steamWrap.appendChild(puff);
    }

    item.appendChild(thumb);
    item.appendChild(body);
    item.onclick = () => openDrawMode(p);
    list.appendChild(item);

    // 让 transition 从 0 长到目标宽度
    requestAnimationFrame(() => { bar.style.width = bar.dataset.width + '%'; });
  });

  list.parentElement.classList.add('heat-printing');
  // 触发动画重排
  void list.offsetWidth;
  setTimeout(() => list.parentElement.classList.remove('heat-printing'), 600);
}

function openLeaderboard() {
  const sorted = [...pizzas].sort((a, b) => b.likes - a.likes);
  const maxLikes = sorted.length ? sorted[0].likes : 1;
  const list = document.getElementById('leaderboardList');
  list.innerHTML = '';
  sorted.forEach((p, i) => {
    const ratio = maxLikes > 0 ? p.likes / maxLikes : 0;
    const widthPct = Math.max(4, Math.round(ratio * 100));
    const card = document.createElement('div');
    card.className = 'lb-card';
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    card.innerHTML = `
      <div class="lb-rank ${rankClass}">${i + 1}</div>
      <div class="lb-thumb"></div>
      <div class="lb-info">
        <div class="lb-name">${p.name}</div>
        <div class="lb-author">by ${p.author} · ${p.time}</div>
      </div>
      <div class="lb-likes">${p.likes}</div>
      <div class="lb-heat-bar"><div class="lb-heat-fill" style="width:${widthPct}%"></div></div>
    `;
    const thumb = card.querySelector('.lb-thumb');
    const cv = document.createElement('canvas');
    cv.width = 120; cv.height = 120;
    drawPizzaOnCanvas(cv, p.seed);
    thumb.appendChild(cv);
    card.onclick = () => { closeLeaderboard(); openDrawMode(p); };
    list.appendChild(card);
  });
  document.getElementById('leaderboardOverlay').classList.add('show');
}
function closeLeaderboard() {
  document.getElementById('leaderboardOverlay').classList.remove('show');
}

function createPizzaItem(item, x, y, rot, size, idx) {
  const el = document.createElement("div");
  el.className = "pizza-item" + (item.isNew ? ' is-new' : '');
  el.style.setProperty('--rot', rot + 'deg');
  el.style.left = (x - size / 2) + 'px';
  el.style.top = (y - size / 2) + 'px';
  el.style.setProperty('--size', size + 'px');
  el.style.zIndex = idx + 1;
  el.style.animationDelay = (idx * 0.02) + 's';

  const frame = document.createElement("div");
  frame.className = "cell-frame";
  el.appendChild(frame);

  if (item.isNew) {
    el.onclick = () => openDrawMode();
    const plate = document.createElement("div");
    plate.className = "plate empty";
    const nameTag = document.createElement("div");
    nameTag.className = "name-tag";
    nameTag.textContent = "Draw Yours";
    el.appendChild(plate);
    el.appendChild(nameTag);
  } else {
    const p = item.p;
    el.onclick = (e) => { if (!e.target.closest(".like-btn")) openDrawMode(p); };

    const likeBtn = document.createElement("div");
    likeBtn.className = "like-btn" + (p.liked ? " liked" : "");
    likeBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="${p.liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2.5"><path d="M12 21s-7-4.6-9.3-8.4C1 9.5 2.7 6 6 6c1.9 0 3.2 1.1 4 2.3C10.8 7.1 12.1 6 14 6c3.3 0 5 3.5 3.3 6.6C19 16.4 12 21 12 21z"/></svg><span>${p.likes}</span>`;
    likeBtn.onclick = (ev) => { ev.stopPropagation(); toggleLike(p, likeBtn); };

    const plate = document.createElement("div");
    plate.className = "plate";
    const cv = document.createElement("canvas");
    cv.width = 320; cv.height = 320;
    drawPizzaOnCanvas(cv, p.seed);
    plate.appendChild(cv);

    const nameTag = document.createElement("div");
    nameTag.className = "name-tag";
    nameTag.textContent = p.name;

    el.appendChild(likeBtn);
    el.appendChild(plate);
    el.appendChild(nameTag);
  }

  wall.appendChild(el);
}

/* ========== 披萨绘制：扁平矢量 + 可爱脸 ========== */
function drawPizzaOnCanvas(cv, seed) {
  const ctx = cv.getContext('2d');
  const R = cv.width / 2, rng = mulberry32(seed);
  const style = seed % 8;

  const crustPool = ["#FFD93D","#FF8C42","#F7DC6F","#BB8FCE","#85C1E9","#FF6B6B","#4ECDC4","#95E1D3"];
  const crust = crustPool[style % crustPool.length];
  const sauce = "#FF4D4D";
  const cheese = "#FFE66D";

  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.save();

  ctx.beginPath(); ctx.arc(R, R, R - 4, 0, Math.PI * 2); ctx.fillStyle = crust; ctx.fill();
  ctx.beginPath(); ctx.arc(R, R, R - 22, 0, Math.PI * 2); ctx.fillStyle = cheese; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(R, R, R - 34, 0, Math.PI * 2); ctx.fillStyle = sauce; ctx.globalAlpha = 0.15; ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(R, R, R - 26, 0, Math.PI * 2); ctx.clip();

  const TOPPINGS = ["#FF4D4D","#4ECDC4","#95E1D3","#9B59B6","#3498DB","#FF8C42","#FFFFFF","#2D2926"];

  switch(style) {
    case 0: {
      for(let i=0;i<5;i++){const a=rng()*Math.PI*2,rr=rng()*(R-50);ctx.beginPath();ctx.arc(R+Math.cos(a)*rr,R+Math.sin(a)*rr,16+rng()*10,0,Math.PI*2);ctx.fillStyle='#FF4D4D';ctx.globalAlpha=.9;ctx.fill();}
      for(let i=0;i<20;i++){const a=rng()*Math.PI*2,rr=rng()*(R-44);ctx.beginPath();ctx.ellipse(R+Math.cos(a)*rr,R+Math.sin(a)*rr,5+rng()*3,3+rng()*2,rng()*Math.PI,0,Math.PI*2);ctx.fillStyle='#2D2926';ctx.globalAlpha=.95;ctx.fill();}
      break;
    }
    case 1: {
      const n=14+Math.floor(rng()*10);
      for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+rng()*.5,rr=18+rng()*(R-58),pr=10+rng()*7;ctx.beginPath();ctx.arc(R+Math.cos(a)*rr,R+Math.sin(a)*rr,pr,0,Math.PI*2);ctx.fillStyle='#CC2222';ctx.globalAlpha=.95;ctx.fill();ctx.beginPath();ctx.arc(R+Math.cos(a)*rr-2,R+Math.sin(a)*rr-2,2,0,Math.PI*2);ctx.fillStyle='#fff';ctx.globalAlpha=.6;ctx.fill();}
      break;
    }
    case 2: {
      for(let i=0;i<12;i++){const a=rng()*Math.PI*2,rr=rng()*(R-46);ctx.beginPath();ctx.arc(R+Math.cos(a)*rr,R+Math.sin(a)*rr,9+rng()*6,0,Math.PI*2);ctx.strokeStyle='#4ECDC4';ctx.lineWidth=4;ctx.globalAlpha=.9;ctx.stroke();}
      for(let i=0;i<8;i++){const a=rng()*Math.PI*2,rr=rng()*(R-48);ctx.beginPath();ctx.ellipse(R+Math.cos(a)*rr,R+Math.sin(a)*rr,11+rng()*5,7+rng()*3,rng()*Math.PI,0,Math.PI*2);ctx.fillStyle='#9B59B6';ctx.globalAlpha=.8;ctx.fill();}
      break;
    }
    case 3: {
      ctx.globalAlpha=.2;ctx.fillStyle='#FF8C42';
      for(let i=0;i<45;i++){const a=rng()*Math.PI*2,rr=rng()*(R-34);ctx.beginPath();ctx.arc(R+Math.cos(a)*rr,R+Math.sin(a)*rr,3+rng()*5,0,Math.PI*2);ctx.fill();}
      for(let i=0;i<8;i++){const a=rng()*Math.PI*2,rr=rng()*(R-50);ctx.beginPath();ctx.arc(R+Math.cos(a)*rr,R+Math.sin(a)*rr,4+rng()*3,0,Math.PI*2);ctx.fillStyle='#4ECDC4';ctx.globalAlpha=.9;ctx.fill();}
      break;
    }
    case 4: {
      for(let i=0;i<12;i++){const a=rng()*Math.PI*2,rr=24+rng()*(R-64),ang=rng()*Math.PI;ctx.save();ctx.translate(R+Math.cos(a)*rr,R+Math.sin(a)*rr);ctx.rotate(ang+a);ctx.beginPath();ctx.ellipse(0,0,13+rng()*5,7+rng()*3,0,0,Math.PI*2);ctx.fillStyle='#FF8C42';ctx.globalAlpha=.9;ctx.fill();ctx.restore();}
      for(let i=0;i<16;i++){const a=rng()*Math.PI*2,rr=rng()*(R-42);ctx.beginPath();ctx.rect(R+Math.cos(a)*rr-4,R+Math.sin(a)*rr-2,8,4);ctx.fillStyle='#FF4D4D';ctx.globalAlpha=.65;ctx.fill();}
      break;
    }
    case 5: {
      for(let i=0;i<18;i++){const a=rng()*Math.PI*2,rr=rng()*(R-42),sz=10+rng()*20;ctx.beginPath();ctx.arc(R+Math.cos(a)*rr,R+Math.sin(a)*rr,sz,0,Math.PI*2);ctx.fillStyle=TOPPINGS[Math.floor(rng()*TOPPINGS.length)];ctx.globalAlpha=.75+rng()*.25;ctx.fill();}
      ctx.lineWidth=3;ctx.lineCap='round';
      for(let i=0;i<10;i++){ctx.strokeStyle=TOPPINGS[i%TOPPINGS.length];ctx.globalAlpha=.5+rng()*.3;ctx.beginPath();let x=R+(rng()-0.5)*100,y=R+(rng()-0.5)*100;ctx.moveTo(x,y);for(let j=0;j<5;j++){x+=(rng()-0.5)*40;y+=(rng()-0.5)*40;ctx.lineTo(x,y);}ctx.stroke();}
      break;
    }
    case 6: {
      for(let i=0;i<20;i++){const a=rng()*Math.PI*2,rr=rng()*(R-44);ctx.beginPath();ctx.arc(R+Math.cos(a)*rr,R+Math.sin(a)*rr,6+rng()*5,0,Math.PI*2);ctx.fillStyle='#2D2926';ctx.globalAlpha=.9;ctx.fill();ctx.beginPath();ctx.arc(R+Math.cos(a)*rr,R+Math.sin(a)*rr,2+rng()*2,0,Math.PI*2);ctx.fillStyle='#4ECDC4';ctx.globalAlpha=.7;ctx.fill();}
      for(let i=0;i<6;i++){const a=rng()*Math.PI*2,rr=rng()*(R-50);ctx.beginPath();ctx.arc(R+Math.cos(a)*rr,R+Math.sin(a)*rr,7+rng()*4,0,Math.PI*2);ctx.fillStyle='#FF4D4D';ctx.globalAlpha=.8;ctx.fill();}
      break;
    }
    case 7: {
      for(let i=0;i<9;i++){const a=rng()*Math.PI*2,rr=22+rng()*(R-58),sx=R+Math.cos(a)*rr,sy=R+Math.sin(a)*rr;ctx.save();ctx.translate(sx,sy);ctx.rotate(a+rng());ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(9,9);ctx.lineTo(-9,9);ctx.closePath();ctx.fillStyle='#FF4D8A';ctx.globalAlpha=.85;ctx.fill();ctx.restore();}
      for(let i=0;i<16;i++){const a=rng()*Math.PI*2,rr=rng()*(R-46);ctx.beginPath();ctx.arc(R+Math.cos(a)*rr,R+Math.sin(a)*rr,4+rng()*3,0,Math.PI*2);ctx.fillStyle='#3498DB';ctx.globalAlpha=.85;ctx.fill();}
      break;
    }
  }

  if (rng() > 0.45) {
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#2D2926';
    const eyeY = R - 6 + rng() * 12;
    const eyeOffset = 11 + rng() * 6;
    ctx.beginPath(); ctx.arc(R - eyeOffset, eyeY, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(R + eyeOffset, eyeY, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2D2926';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const mouthStyle = rng();
    if (mouthStyle < 0.33) {
      ctx.arc(R, eyeY + 9, 5, 0.2, Math.PI - 0.2);
    } else if (mouthStyle < 0.66) {
      ctx.moveTo(R - 4, eyeY + 9); ctx.lineTo(R + 4, eyeY + 9);
    } else {
      ctx.arc(R, eyeY + 14, 5, Math.PI + 0.2, -0.2);
    }
    ctx.stroke();
  }

  ctx.restore();
}

/* ========== 点赞 ========== */
function toggleLike(p, btn) {
  p.liked = !p.liked;
  if (p.liked) { p.likes++; btn.classList.add('liked'); btn.querySelector('svg').setAttribute('fill','currentColor'); spawnHearts(btn); }
  else { p.likes=Math.max(0,p.likes-1); btn.classList.remove('liked'); btn.querySelector('svg').setAttribute('fill','none'); }
  btn.querySelector('span').textContent = p.likes;
  updateStats();
  // 点赞可能改变排名，稍后刷新小票墙
  setTimeout(renderHeatWall, 400);
}
function spawnHearts(el) {
  const r = el.getBoundingClientRect();
  for(let i=0;i<3;i++){
    const h=document.createElement('div');h.className='float-heart';
    h.textContent=['\u2764\uFE0F','\uD83E\uDDE1','\uD83D\uDC97'][i];
    h.style.left=(r.left+r.width/2+(Math.random()*40-20))+'px';h.style.top=r.top+'px';
    h.style.animationDelay=(i*.08)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),1300);
  }
}
function updateStats() {
  document.getElementById('total-count').textContent=pizzas.length;
  const likes=pizzas.reduce((s,p)=>s+p.likes,0);
  document.getElementById('total-likes').textContent=likes>999?(likes/1000).toFixed(1)+'k':likes;
}

/* ========== 绘制模式 ========== */
let curColor=COLORS[0],brushSize=10,erasing=false,isDrawing=false,lastPos=null,currentPizza=null;
const drawOverlay=document.getElementById('drawOverlay'),drawCanvas=document.getElementById('drawCanvas'),drawCtx=drawCanvas.getContext('2d'),PLATE_R=drawCanvas.width/2;

function initDrawPlate(){
  drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
  drawCtx.beginPath();drawCtx.arc(PLATE_R,PLATE_R,PLATE_R-14,0,Math.PI*2);drawCtx.fillStyle='#FFD93D';drawCtx.fill();
  drawCtx.beginPath();drawCtx.arc(PLATE_R,PLATE_R,PLATE_R-44,0,Math.PI*2);drawCtx.fillStyle='#FFE66D';drawCtx.globalAlpha=.85;drawCtx.fill();drawCtx.globalAlpha=1;
  drawCtx.save();drawCtx.beginPath();drawCtx.arc(PLATE_R,PLATE_R,PLATE_R-48,0,Math.PI*2);drawCtx.clip();
}
function openDrawMode(pizza){
  currentPizza = pizza || null;
  document.getElementById('drawTitle').textContent = pizza ? `Editing: ${p.name}` : 'Draw Your Pizza';
  initDrawPlate();

  // 披萨墙掉落出屏幕，小票墙同步右滑
  const items = document.querySelectorAll('.pizza-item');
  items.forEach((el, i) => {
    setTimeout(() => el.classList.add('falling'), i * 6);
  });
  document.getElementById('heatWall').classList.add('falling');

  // 披萨掉出屏幕后画板淡入
  setTimeout(() => drawOverlay.classList.add('show'), 360);
}
function closeDrawMode(){
  // 画板淡出/掉落
  drawOverlay.classList.add('hiding');
  setTimeout(() => {
    drawOverlay.classList.remove('show', 'hiding');
    drawCtx.restore();
    // 小票墙回来
    document.getElementById('heatWall').classList.remove('falling');
    // 披萨墙从顶部重新落下
    gridLayout();
  }, 650);
}
function saveDrawing(){
  if(!currentPizza){
    const newP = generatePizzaData(Date.now() % 1000);
    newP.name = 'My Pizza #' + newP.id;
    newP.likes = 0;
    pizzas.unshift(newP);
    colorBalancePizzas();
    toast('Saved! Welcome to the grid.');
  } else {
    toast(`"${currentPizza.name}" updated!`);
  }
  closeDrawMode();
  // 等墙落下后刷新小票排名
  setTimeout(renderHeatWall, 900);
}

function getCanvasPos(e){const r=drawCanvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*drawCanvas.width,y:(e.clientY-r.top)/r.height*drawCanvas.height};}
drawCanvas.addEventListener('pointerdown',e=>{isDrawing=true;lastPos=getCanvasPos(e);stroke(lastPos.x,lastPos.y,lastPos.x,lastPos.y);drawCanvas.setPointerCapture(e.pointerId);});
drawCanvas.addEventListener('pointermove',e=>{if(!isDrawing)return;const pos=getCanvasPos(e);stroke(lastPos.x,lastPos.y,pos.x,pos.y);lastPos=pos;});
const endDraw=()=>{isDrawing=false;lastPos=null;};
drawCanvas.addEventListener('pointerup',endDraw);drawCanvas.addEventListener('pointercancel',endDraw);
function stroke(x0,y0,x1,y1){drawCtx.lineCap='round';drawCtx.lineJoin='round';drawCtx.strokeStyle=erasing?'#FFE66D':curColor;drawCtx.lineWidth=erasing?brushSize*2.5:brushSize;drawCtx.beginPath();drawCtx.moveTo(x0,y0);drawCtx.lineTo(x1,y1);drawCtx.stroke();}

const swatchContainer=document.getElementById('colorSwatches');
COLORS.forEach((c,i)=>{const s=document.createElement('div');s.className='color-swatch'+(i===0?' active':'');s.style.background=c;s.onclick=()=>{curColor=c;erasing=false;document.getElementById('eraserBtn').classList.remove('active');document.querySelectorAll('.color-swatch').forEach(x=>x.classList.remove('active'));s.classList.add('active');};swatchContainer.appendChild(s);});
document.getElementById('brushSize').oninput=e=>brushSize=+e.target.value;
function toggleEraser(){erasing=!erasing;document.getElementById('eraserBtn').classList.toggle('active',erasing);if(erasing)document.querySelectorAll('.color-swatch').forEach(x=>x.classList.remove('active'));}
function clearCanvas(){initDrawPlate();}

let toastTimer;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}

/* ========== 启动 ========== */
window.addEventListener('resize', () => { gridLayout(); renderHeatWall(); });
requestAnimationFrame(() => { gridLayout(); renderHeatWall(); });
</script>
